<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="按期刊、专题和日期浏览人体运动与运动生理研究。">
<title>运动生理文献库</title>
<style>:root {
  color-scheme: light;
  --navy:#132c42;
  --muted:#4c6273;
  --teal:#075c57;
  --wash:#f2f6f8;
  --ink:#142d40;
  --line:#d7e2e8;
  --paper:#fff;
  font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  color:var(--ink);
  background:var(--wash);
}
*, *::before, *::after { box-sizing:border-box; }
body { margin:0; min-width:280px; font-size:1rem; line-height:1.55; }
[hidden] { display:none !important; }
a { color:var(--teal); }
a:hover { text-decoration:underline; }
button,input,select { font:inherit; }
button { cursor:pointer; }
button:disabled { cursor:default; opacity:.5; }
:focus-visible { outline:3px solid #117d74; outline-offset:3px; }
h1,h2,h3,h4,p,dl,dd { margin:0; }
.shell { max-width:1360px; padding-inline:clamp(1rem,4vw,3.75rem); margin-inline:auto; }
.skip { position:absolute; top:-10rem; left:1rem; z-index:2; background:white; padding:.7rem; }
.skip:focus { top:1rem; }
.visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.masthead { background:#102638; color:#fff; border-bottom:1px solid #3b5567; }
.mast-inner { min-height:3.65rem; display:flex; align-items:center; justify-content:space-between; gap:.6rem 1.5rem; flex-wrap:wrap; padding-block:.65rem; }
.brand { display:flex; align-items:center; gap:.65rem; font-size:1rem; font-weight:700; }
.brand-mark { width:1.1rem; height:1rem; border-left:3px solid #77d0ba; border-block:3px solid #77d0ba; transform:skewY(-13deg); }
.update { color:#c8dce5; font-size:.88rem; font-variant-numeric:tabular-nums; }
.hero { color:#fff; background:linear-gradient(110deg,#132c42 52%,#173e4b); }
.hero-inner { min-height:10.6rem; display:flex; align-items:center; justify-content:space-between; gap:1.5rem 2.5rem; padding-block:clamp(1.75rem,4vw,3rem); }
.hero h1 { font-size:clamp(2rem,4.5vw,3.2rem); letter-spacing:.045em; line-height:1.2; font-weight:750; }
.hero p { color:#cddfe7; margin-top:.7rem; }
.overview { display:flex; gap:2.2rem; flex-shrink:0; border-left:1px solid #58767f; padding-left:2rem; }
.overview div { display:flex; flex-direction:column-reverse; }
.overview dd { font-size:2rem; line-height:1.1; font-weight:750; font-variant-numeric:tabular-nums; }
.overview dt { margin-top:.45rem; color:#d3e6e9; font-size:.9rem; }
.workspace { display:grid; grid-template-columns: minmax(220px,255px) minmax(0,1fr); gap:clamp(1.2rem,3vw,2.8rem); padding-block:2.2rem 2.75rem; }
.filters { align-self:start; min-width:0; background:var(--paper); border:1px solid var(--line); border-radius:.8rem; padding:1.15rem; }
.filter-head,.results-head,.results-tools { display:flex; align-items:center; justify-content:space-between; gap:.65rem 1rem; flex-wrap:wrap; }
.filter-head { margin-bottom:1rem; }
.filter-head h2 { font-size:1.075rem; }
.text-button { color:var(--teal); background:transparent; border:0; padding:.25rem 0; font-size:.88rem; }
.text-button:hover { text-decoration:underline; }
#filters { display:grid; gap:.45rem; }
#filters label { font-size:.9rem; font-weight:650; margin-top:.45rem; }
input, select { color:var(--ink); background:#fff; border:1px solid #aabecb; border-radius:.4rem; min-height:2.7rem; width:100%; min-width:0; padding:.45rem .65rem; }
select { appearance:none; padding-right:1.8rem; background-image:linear-gradient(45deg,transparent 50%,#40596d 50%),linear-gradient(135deg,#40596d 50%,transparent 50%); background-position:calc(100% - 14px) 53%,calc(100% - 9px) 53%; background-size:5px 5px; background-repeat:no-repeat; text-overflow:ellipsis; }
input:focus, select:focus { border-color:#117d74; }
.field-note,.coverage p,.error { font-size:.875rem; color:var(--muted); line-height:1.55; }
.field-note,.error { margin-top:.25rem; }
.error { color:#9b221d; }
.coverage { border-top:1px solid var(--line); margin-top:1rem; padding-top:.9rem; }
.coverage summary { cursor:pointer; font-size:.9rem; font-weight:650; }
.coverage p { margin-top:.45rem; }
.results { min-width:0; }
.results-head h2 { font-size:1.65rem; line-height:1.2; }
.result-count { font-size:.94rem; color:var(--muted); font-variant-numeric:tabular-nums; }
.search-wrap { margin:.9rem 0 .8rem; }
.search-wrap input { padding:.6rem .95rem; min-height:3rem; }
.results-tools { margin-bottom:1.2rem; }
.tabs { display:flex; gap:.25rem; padding:.25rem; border:1px solid var(--line); border-radius:.55rem; background:#e9f0f4; }
.tabs button { min-height:2.2rem; padding:.35rem .72rem; border:0; background:transparent; color:var(--muted); border-radius:.33rem; font-size:.875rem; font-weight:650; }
.tabs button[aria-pressed="true"] { background:#fff; color:var(--teal); box-shadow:0 1px 4px #1e394324; }
.sort { display:flex; align-items:center; gap:.55rem; font-size:.875rem; }
.sort label { flex:none; color:var(--muted); }
.sort select { min-height:2.55rem; }
.journal-group + .journal-group { margin-top:1.2rem; }
.journal-heading { border-left:4px solid #188479; padding:.2rem .65rem; margin-bottom:.55rem; font-size:1.1rem; line-height:1.4; overflow-wrap:anywhere; }
.topic-heading { font-size:.886rem; color:var(--teal); margin:.55rem 0 .35rem; }
.article-list { list-style:none; padding:0; margin:0; background:white; border:1px solid var(--line); border-radius:.65rem; }
.article { padding:.95rem 1.05rem; overflow-wrap:anywhere; }
.article + .article { border-top:1px solid var(--line); }
.article-meta { display:flex; align-items:center; flex-wrap:wrap; gap:.32rem .75rem; color:var(--muted); font-size:.875rem; margin-bottom:.3rem; }
.article-meta time { font-variant-numeric:tabular-nums; }
.article-meta .topic { color:var(--teal); }
.article-title { font-size:1.05rem; font-weight:700; line-height:1.45; }
.article-title a { color:inherit; text-decoration:none; text-decoration-thickness:1px; text-underline-offset:.2em; }
.article-title a:hover { color:var(--teal); text-decoration:underline; }
.english { margin-top:.25rem; color:var(--muted); font-size:.9rem; }
.empty { padding:2rem 1rem; text-align:center; background:#fff; border:1px solid var(--line); border-radius:.65rem; }
.empty p { color:var(--muted); margin-top:.35rem; }
.pagination { display:flex; align-items:center; justify-content:center; gap:.85rem; margin-top:1.25rem; font-size:.9rem; color:var(--muted); }
.pagination button { color:var(--teal); background:#fff; border:1px solid var(--line); border-radius:.4rem; padding:.4rem .75rem; }
.footer { padding-block:1rem 2rem; color:var(--muted); border-top:1px solid var(--line); font-size:.85rem; }
@media(max-width:800px) {
  .workspace { grid-template-columns:1fr; padding-top:1.25rem; }
  #filters { grid-template-columns:minmax(6rem,.6fr) minmax(0,1fr); align-items:center; column-gap:.75rem; }
  #filters label { margin:0; }
  #date-help,#date-error { grid-column:1/-1; }
}
@media(max-width:520px) {
  .hero-inner { align-items:flex-start; flex-direction:column; }
  .overview { padding:0; border:0; }
  .overview dd { font-size:1.6rem; }
  .article { padding:.8rem; }
}
</style>
</head>
<body>
<a class="skip" href="#results">跳到论文结果</a>
<header class="masthead">
  <div class="mast-inner shell">
    <span class="brand"><span class="brand-mark" aria-hidden="true"></span>运动生理文献库</span>
    <p class="update" id="updated"></p>
  </div>
</header>
<main>
  <div class="hero">
    <div class="shell hero-inner">
      <div>
        <h1>人体运动研究</h1>
        <p>追踪运动生理、训练适应与运动表现的新论文。</p>
      </div>
      <dl class="overview">
        <div><dt>文章</dt><dd id="total-articles">—</dd></div>
        <div><dt>重点追踪期刊</dt><dd id="total-journals">—</dd></div>
      </dl>
    </div>
  </div>
  <div class="shell workspace">
    <aside class="filters" aria-labelledby="filters-heading">
      <div class="filter-head"><h2 id="filters-heading">筛选</h2><button type="button" id="clear" class="text-button">清除筛选</button></div>
      <form id="filters">
        <label for="journal">期刊</label>
        <select id="journal"><option value="">全部期刊</option></select>
        <label for="topic">专题</label>
        <select id="topic"><option value="">全部专题</option></select>
        <label for="date-field">日期类型</label>
        <select id="date-field">
          <option value="published">发表日期</option>
          <option value="seen">收录日期</option>
        </select>
        <label for="date-start">起始日期</label>
        <input id="date-start" type="date">
        <label for="date-end">结束日期</label>
        <input id="date-end" type="date">
        <p id="date-error" class="error" hidden role="alert">结束日期需晚于或等于起始日期。</p>
        <p id="date-help" class="field-note"></p>
      </form>
      <details class="coverage">
        <summary>收录范围</summary>
        <p>收录人体运动、训练表现和运动生理研究。根据题名及可用索引筛选，专题为自动归类。</p>
      </details>
    </aside>
    <section id="results" class="results" aria-labelledby="results-heading">
      <div class="results-head">
        <h2 id="results-heading">论文</h2>
        <span id="result-count" class="result-count" role="status" aria-live="polite"></span>
      </div>
      <div class="search-wrap">
        <label class="visually-hidden" for="query">搜索中英文题名或 DOI</label>
        <input id="query" type="search" placeholder="搜索中文题名、英文题名或 DOI" autocomplete="off">
      </div>
      <div class="results-tools">
        <div class="tabs" role="group" aria-label="论文来源">
          <button type="button" data-scope="" aria-pressed="true">全部</button>
          <button type="button" data-scope="focus" aria-pressed="false">重点期刊</button>
          <button type="button" data-scope="other" aria-pressed="false">刊外补漏</button>
        </div>
        <div class="sort">
          <label for="sort">排序</label>
          <select id="sort">
            <option value="grouped">期刊与专题</option>
            <option value="recent">日期从新到旧</option>
          </select>
        </div>
      </div>
      <div id="articles"></div>
      <nav id="pagination" class="pagination" aria-label="论文分页" hidden>
        <button type="button" id="prev">上一页</button>
        <span id="page-status"></span>
        <button type="button" id="next">下一页</button>
      </nav>
      <noscript><p>请启用 JavaScript 以使用筛选功能。</p></noscript>
    </section>
  </div>
</main>
<footer class="shell footer">中文标题为机器译文。英文原题和原文入口可用于核对。</footer>

Sampling Frequency Requirements for Estimating Physical Activity Metrics from Wearable Accelerometer Data.","zh":"根据可穿戴加速计数据对物理活动计量进行估计的抽样频率要求。","doi":"10.3390/s26206652","url":"https://doi.org/10.3390/s26206652","published":"2026-10-21","seen":"2026-11-20"},{"journal":"Bioengineering (Basel, Switzerland)","focused":false,"topic":"可穿戴设备、运动监测与数据建模","en":"Criterion Validity of Smartwatches for Measuring Heart Rate and Energy Expenditure During Resistance Exercise.","zh":"在抵抗运动期间测量心率和能量消耗的智能表的标准有效性。","doi":"10.3390/bioengineering13101099","url":"https://doi.org/10.3390/bioengineering13101099","published":"2026-09-23","seen":"2026-11-20"},{"journal":"Journal of physical activity & health","focused":false,"topic":"可穿戴设备、运动监测与数据建模","en":"24-Hour Movement Guideline Compliance and Physical Fitness in Uruguayan Preschoolers: The Role of Specific Behavior Combinations.","zh":"乌拉圭学龄前儿童24小时运动准则的遵守和身体健康:特定行为组合的作用。","doi":"10.1123/jpah.2026-0131","url":"https://doi.org/10.1123/jpah.2026-0131","published":"2026-10-23","seen":"2026-11-20"},{"journal":"Journal of physical activity & health","focused":false,"topic":"可穿戴设备、运动监测与数据建模","en":"Systematic Review and Meta-Analysis of Parent-Child Moderate to Vigorous Physical Activity Correlations Across Childhood Developmental Stages and Sex-Specific Dyads.","zh":"对儿童发育阶段和特定性别的亲子活动关联性进行系统综述和分析。","doi":"10.1123/jpah.2025-0421","url":"https://doi.org/10.1123/jpah.2025-0421","published":"2026-10-23","seen":"2026-11-20"},{"journal":"Journal of functional morphology and kinesiology","focused":false,"topic":"可穿戴设备、运动监测与数据建模","en":"A Hybrid Ultra-Wideband and Inertial Measurement Unit Sensor System Can Accurately Measure the Sprinting Performance in Young Male Soccer Players.","zh":"混合超宽波段和惯性测量单元传感器系统可以精确测量年轻男性足球运动员的冲刺性能.","doi":"10.3390/jfmk11040421","url":"https://doi.org/10.3390/jfmk11040421","published":"2026-10-14","seen":"2026-11-20"},{"journal":"Journal of functional morphology and kinesiology","focused":false,"topic":"可穿戴设备、运动监测与数据建模","en":"Machine Learning Applications for Wearable Sensor Data in Tennis and Padel: A Systematic Review of Movement Recognition, Performance Monitoring, and Emerging Injury-Related Applications.","zh":"网球和帕德尔可穿戴传感器数据的机器学习应用:系统综述运动识别、性能监测和与新伤害有关的应用。","doi":"10.3390/jfmk11040391","url":"https://doi.org/10.3390/jfmk11040391","published":"2026-09-29","seen":"2026-11-20"},{"journal":"BMC sports science, medicine & rehabilitation","focused":false,"topic":"可穿戴设备、运动监测与数据建模","en":"Acute kinematic changes following low-intensity tethered swimming as a constraints-led priming strategy in competitive swimmers.","zh":"低强度系绳泳后发生急性动脉变化,作为竞技游泳运动员中受约束的领跑策略.","doi":"10.1186/s13102-026-01896-2","url":"https://doi.org/10.1186/s13102-026-01896-2","published":"2026-07-27","seen":"2026-11-20"},{"journal":"Pediatric exercise science","focused":false,"topic":"可穿戴设备、运动监测与数据建模","en":"Associations of Accumulating Physical Activity and Sedentary Time From Childhood to Adolescence With Arterial Stiffness and Structure in Adolescence-An 8-Year Follow-Up Study.","zh":"青少年体力活动积累协会和从儿童到青少年的固定时间,以及青少年体质和结构 -- -- 8年后续研究。","doi":"10.1123/pes.2025-0177","url":"https://doi.org/10.1123/pes.2025-0177","published":"2026-10-21","seen":"2026-11-20"},{"journal":"Health reports","focused":false,"topic":"可穿戴设备、运动监测与数据建模","en":"Trends in physical activity among Canadian adults from 2007 to 2024.","zh":"2007年至2024年加拿大成年人的体育活动趋势.","doi":"10.25318/82-003-x202601000002-eng","url":"https://doi.org/10.25318/82-003-x202601000002-eng","published":"","seen":"2026-11-20"}],"journals":["British Journal of Sports Medicine","Journal of Sport and Health Science","Sports Medicine","Biology of Sport","Sports Medicine - Open","The American Journal of Sports Medicine","Exercise and Sport Sciences Reviews","Journal of Science and Medicine in Sport","Scandinavian Journal of Medicine & Science in Sports","Journal of Strength and Conditioning Research","International Journal of Sports Physiology and Performance","Journal of Sports Science and Medicine","Journal of Human Kinetics","Journal of Exercise Science & Fitness","Journal of Sports Sciences","Journal of Applied Physiology","Frontiers in Physiology","Physiology","Medicine & Science in Sports & Exercise","European Journal of Applied Physiology","European Journal of Sport Science","Experimental Physiology","The Journal of Physiology","Applied Physiology, Nutrition, and Metabolism"],"topics":["临界功率、耐力与氧摄取动力学","训练负荷、恢复与运动表现","可穿戴设备、运动监测与数据建模","损伤、康复与运动医学","生物力学与运动控制","营养、能量代谢与补剂","肌肉、心肺与整合生理","体力活动、健康与人群干预","编辑信息、勘误与撤稿","其他或题名信息不足"],"updated":"2026-11-20"}</script>
<script>(() => {
  "use strict";

  const get = (id) => document.getElementById(id);
  const data = JSON.parse(get("dataset").textContent);
  const journal = get("journal");
  const topic = get("topic");
  const dateField = get("date-field");
  const dateStart = get("date-start");
  const dateEnd = get("date-end");
  const query = get("query");
  const sort = get("sort");
  const articles = get("articles");
  const tabs = [...document.querySelectorAll("button[data-scope]")];
  const pageSize = 20;
  const collator = new Intl.Collator("zh-CN", { numeric: true, sensitivity: "base" });
  const journalRank = new Map(data.journals.map((name, index) => [name, index]));
  const topicRank = new Map(data.topics.map((name, index) => [name, index]));
  const allTopics = [...new Set(data.records.map(record => record.topic))];
  const allJournals = [...new Set([...data.journals, ...data.records.map(record => record.journal)])];
  let page = 1;
  let scope = "";

  function normal(value) {
    return value.normalize("NFKC").toLowerCase();
  }

  function compareJournal(a, b) {
    return (journalRank.get(a) ?? journalRank.size) - (journalRank.get(b) ?? journalRank.size)
      || collator.compare(a, b);
  }

  function compareTopic(a, b) {
    return (topicRank.get(a) ?? topicRank.size) - (topicRank.get(b) ?? topicRank.size)
      || collator.compare(a, b);
  }

  function bounds(value) {
    if (!value) return null;
    const parts = value.split("-");
    const [year, month] = parts.map(Number);
    if (parts.length === 1) return [value + "-01-01", value + "-12-31"];
    if (parts.length === 2) {
      const lastDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
      return [value + "-01", value + "-" + String(lastDay).padStart(2, "0")];
    }
    return [value, value];
  }

  const records = data.records.map(record => ({
    ...record,
    publishedBounds: bounds(record.published),
    searchable: normal([record.zh, record.en, record.doi].join(" ")),
  }));

  function node(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text) element.textContent = text;
    return element;
  }

  function addOptions(select, values) {
    for (const value of values) {
      const option = node("option", "", value);
      option.value = value;
      select.append(option);
    }
  }

  function setScope(value) {
    scope = value;
    for (const tab of tabs) {
      tab.setAttribute("aria-pressed", String(tab.dataset.scope === scope));
    }
  }

  function time(value) {
    const element = node("time", "", value);
    element.dateTime = value;
    return element;
  }

  function articleRow(record, grouped) {
    const row = node("li", "article");
    const meta = node("div", "article-meta");
    const shownDate = record[dateField.value];
    meta.append(shownDate ? time(shownDate) : node("span", "", "发表日期未记录"));
    if (!grouped) {
      meta.append(node("span", "", record.journal), node("span", "topic", record.topic));
    }
    if (!record.focused) meta.append(node("span", "", "刊外补漏"));
    const title = node("div", "article-title");
    if (record.url) {
      const link = node("a", "", record.zh || record.en);
      link.href = record.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      title.append(link);
    } else {
      title.textContent = record.zh || record.en;
    }
    row.append(meta, title);
    if (record.zh) {
      const original = node("p", "english", record.en);
      original.lang = "en";
      row.append(original);
    }
    return row;
  }

  function renderRows(rows) {
    if (sort.value === "recent") {
      const list = node("ul", "article-list");
      for (const record of rows) list.append(articleRow(record, false));
      articles.replaceChildren(list);
      return;
    }

    const grouped = document.createDocumentFragment();
    let previousJournal;
    let previousTopic;
    let section;
    let list;
    for (const record of rows) {
      if (record.journal !== previousJournal) {
        section = node("section", "journal-group");
        section.append(node("h3", "journal-heading", record.journal));
        grouped.append(section);
        previousJournal = record.journal;
        previousTopic = undefined;
      }
      if (record.topic !== previousTopic) {
        list = node("ul", "article-list");
        section.append(node("h4", "topic-heading", record.topic), list);
        previousTopic = record.topic;
      }
      list.append(articleRow(record, true));
    }
    articles.replaceChildren(grouped);
  }

  function matchesDate(record, start, end) {
    if (!start && !end) return true;
    const range = dateField.value === "published"
      ? record.publishedBounds
      : [record.seen, record.seen];
    return Boolean(range && range[0] && (!start || range[1] >= start) && (!end || range[0] <= end));
  }

  function render() {
    const from = dateStart.value;
    const to = dateEnd.value;
    const invalid = Boolean(from && to && from > to);
    get("date-error").hidden = !invalid;
    dateStart.setAttribute("aria-invalid", String(invalid));
    dateEnd.setAttribute("aria-invalid", String(invalid));
    get("date-help").textContent = dateField.value === "seen"
      ? "按系统首次收录的日期筛选。"
      : "按数据库提供的发表日期筛选。";

    const words = normal(query.value).trim().split(/\s+/u).filter(Boolean);
    const matches = invalid ? [] : records.filter(record =>
      (!journal.value || record.journal === journal.value)
      && (!topic.value || record.topic === topic.value)
      && (!scope || record.focused === (scope === "focus"))
      && matchesDate(record, from, to)
      && words.every(word => record.searchable.includes(word))
    );
    function newest(a, b) {
      return (b[dateField.value] || "").localeCompare(a[dateField.value] || "")
        || collator.compare(a.en, b.en);
    }
    if (sort.value === "grouped") {
      matches.sort((a, b) => compareJournal(a.journal, b.journal)
        || compareTopic(a.topic, b.topic) || newest(a, b));
    } else {
      matches.sort(newest);
    }

    const maxPage = Math.max(1, Math.ceil(matches.length / pageSize));
    page = Math.min(page, maxPage);
    get("result-count").textContent = matches.length.toLocaleString("zh-CN") + " 篇";
    get("pagination").hidden = matches.length <= pageSize;
    get("prev").disabled = page === 1;
    get("next").disabled = page === maxPage;
    get("page-status").textContent = "第 " + page + " / " + maxPage + " 页";
    if (matches.length) {
      renderRows(matches.slice((page - 1) * pageSize, page * pageSize));
    } else {
      const empty = node("div", "empty");
      empty.append(node("strong", "", invalid ? "请检查日期范围" : "没有符合条件的论文"));
      if (!invalid) empty.append(node("p", "", "可以扩大日期范围或清除部分筛选条件。"));
      articles.replaceChildren(empty);
    }
  }

  function refilter() {
    page = 1;
    render();
  }

  function turnPage(offset) {
    page += offset;
    render();
    get("results-heading").focus();
    get("results").scrollIntoView({ block: "start" });
  }

  addOptions(journal, allJournals.sort(compareJournal));
  addOptions(topic, allTopics.sort(compareTopic));
  get("total-articles").textContent = records.length.toLocaleString("zh-CN");
  get("total-journals").textContent = data.journals.length;
  get("updated").textContent = data.updated ? "最近检索 " + data.updated : "暂未收录";
  get("results-heading").tabIndex = -1;
  get("filters").addEventListener("submit", event => event.preventDefault());
  get("filters").addEventListener("input", refilter);
  query.addEventListener("input", refilter);
  sort.addEventListener("change", refilter);
  for (const tab of tabs) {
    tab.addEventListener("click", () => {
      setScope(tab.dataset.scope);
      refilter();
    });
  }
  get("clear").addEventListener("click", () => {
    get("filters").reset();
    query.value = "";
    setScope("");
    refilter();
  });
  get("prev").addEventListener("click", () => turnPage(-1));
  get("next").addEventListener("click", () => turnPage(1));
  render();
})();

</script>
