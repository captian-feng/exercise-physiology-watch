name: 回填中文摘要并部署

on:
  push:
    paths:
      - "translation-backfill/**"
      - "apply_abstract_backfill.py"
      - "static_site.py"
      - "site-src/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore archive
        run: |
          python - <<'PY'
          import gzip, shutil
          with gzip.open("catalog.sqlite.gz", "rb") as src, open("catalog.sqlite", "wb") as dst:
              shutil.copyfileobj(src, dst)
          PY
      - name: Apply abstract backfill
        run: python -X utf8 apply_abstract_backfill.py
      - name: Rebuild static site
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from static_site import write_site
          journals = [x.strip() for x in Path("journals.txt").read_text(encoding="utf-8").splitlines() if x.strip() and not x.startswith("#")]
          db = sqlite3.connect("catalog.sqlite")
          write_site(db, journals)
          db.close()
          PY
          mkdir -p dist
          cp site/index.html dist/index.html
      - name: Persist archive
        run: |
          python - <<'PY'
          import gzip, shutil
          with open("catalog.sqlite", "rb") as src, gzip.open("catalog.sqlite.gz", "wb") as dst:
              shutil.copyfileobj(src, dst)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.sqlite.gz dist/index.html
          git diff --cached --quiet || git commit -m "Apply Chinese abstract translations"
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

