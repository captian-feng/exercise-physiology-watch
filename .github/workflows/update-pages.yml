name: 更新运动生理文献库

on:
  schedule:
    # GitHub cron is UTC: these are 07:30 and 11:00 in Asia/Shanghai.
    # Scheduled runs are best-effort and can be delayed or skipped.
    - cron: "30 23 * * *"
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-pages.yml"
      - "*.py"
      - "scripts/**"
      - "site-src/**"
      - "journals.txt"
      - "sources.json"
      - "exercise_glossary.json"
      - "deepseek_top100.json"
      - "article_type_overrides.json"
      - "pubmed_online_dates.json"
      - "crossref_online_dates.json"
      - "publisher_online_dates.json"
      - "requirements.txt"
      # The committed site and the bootstrap archive are build outputs; a manual
      # change to either should still rebuild and redeploy instead of going live
      # unchecked.
      - "dist/**"
      - "catalog.sqlite.gz"
  workflow_dispatch:

concurrency:
  group: journal-archive-and-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: models/
          key: argos-en-zh-1-9
      - name: Restore last successful archive
        run: python scripts/archive_state.py restore "$RUNNER_TEMP/journal-archive-base"
      - name: Install translation dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect papers and build the static site
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK }}
          # This override is enabled only for the explicitly approved trial push.
          DEEPSEEK_PEAK_TRIAL: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[peak100]') && '1' || '' }}
        run: python -X utf8 cloud_refresh.py
      - name: Save the updated archive
        run: python scripts/archive_state.py persist "$RUNNER_TEMP/journal-archive-base"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: update
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4



