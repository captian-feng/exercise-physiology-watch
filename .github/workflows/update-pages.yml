name: 更新运动生理文献库

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: Asia/Shanghai
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-pages.yml"
      - "*.py"
      - "scripts/**"
      - "site-src/**"
      - "journals.txt"
      - "sources.json"
      - "exercise_glossary.json"
      - "requirements.txt"
      # The committed site and the bootstrap archive are build outputs; a manual
      # change to either should still rebuild and redeploy instead of going live
      # unchecked.
      - "dist/**"
      - "catalog.sqlite.gz"
  workflow_dispatch:

concurrency:
  group: journal-archive-and-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: models/
          key: argos-en-zh-1-9
      - name: Restore last successful archive
        run: python scripts/archive_state.py restore "$RUNNER_TEMP/journal-archive-base"
      - name: Install translation dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect papers and build the static site
        run: python -X utf8 cloud_refresh.py
      - name: Save the updated archive
        run: python scripts/archive_state.py persist "$RUNNER_TEMP/journal-archive-base"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: update
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

