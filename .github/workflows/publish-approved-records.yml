name: Publish approved literature records
on:
  push:
    paths: ["approved-records/*.json"]
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: controlled-incremental-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Resolve DOI metadata, translate, and append only new records
        env: {DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}}
        run: |
          python -X utf8 - <<'PY'
          import gzip,hashlib,json,sqlite3,urllib.request,urllib.parse,re
          from html.parser import HTMLParser
          from pathlib import Path
          class Text(HTMLParser):
            def __init__(self): super().__init__(); self.a=[]
            def handle_data(self,x): self.a.append(x)
            def out(self): return ' '.join(self.a)
          items=[]
          for p in sorted(Path("approved-records").glob("*.json")): items += json.loads(p.read_text(encoding="utf-8"))["records"]
          for x in items:
            if "article" in x: continue
            doi=x["doi"].lower(); msg=json.load(urllib.request.urlopen("https://api.crossref.org/works/"+urllib.parse.quote(doi,safe="")))["message"]
            h=Text(); h.feed(msg.get("abstract","")); abstract=h.out().strip()
            assert len(abstract)>30, "No verified abstract: "+doi
            prompt="将英文论文标题翻译为简体中文，并仅依据英文摘要准确翻译为简体中文摘要；不得添加结论。返回JSON字段zh和summary。\n标题："+msg["title"][0]+"\n摘要："+abstract
            body=json.dumps({"model":"deepseek-flash","messages":[{"role":"user","content":prompt}],"response_format":{"type":"json_object"},"thinking":{"type":"disabled"},"temperature":0.1,"max_tokens":1400}).encode()
            key=__import__("os").environ["DEEPSEEK_API_KEY"]; req=urllib.request.Request("https://api.deepseek.com/chat/completions",data=body,headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"})
            out=json.loads(json.load(urllib.request.urlopen(req))["choices"][0]["message"]["content"])
            assert out.get("zh") and out.get("summary"), "Empty translation: "+doi
            date="-".join(map(str,(msg.get("published-online") or msg.get("published-print") or msg.get("issued"))["date-parts"][0]))
            x["zh_title"]=out["zh"]; x["zh_abstract"]=out["summary"]; x["pmid"]=""
            x["article"]={"doi":doi,"pmid":"","title":msg["title"][0],"author":(msg.get("author") or [{}])[0].get("family",""),"date":date,"type":x["article_type"],"venue":(msg.get("container-title") or [""])[0],"journal":(msg.get("container-title") or [""])[0],"url":"https://doi.org/"+doi,"sources":["Crossref"],"topics":[x["topic"]]}
          with gzip.open("catalog.sqlite.gz","rb") as s,open("catalog.sqlite","wb") as d:d.write(s.read())
          db=sqlite3.connect("catalog.sqlite"); existing={r[0].lower() for r in db.execute("select doi from articles where doi is not null")}
          new=[x for x in items if x["article"]["doi"] not in existing]
          page=Path("dist/index.html").read_text(encoding="utf-8"); tag='<script id="dataset" type="application/json">'; a=page.index(tag)+len(tag); b=page.index("</script>",a); data=json.loads(page[a:b]); before=len(data["records"]); pd={r.get("d","").lower() for r in data["records"]}
          for x in new:
            q=x["article"]; assert q["doi"] not in pd
            db.execute("insert into articles(doi,pmid,fingerprint,data,first_seen) values (?,?,?,?,?)",(q["doi"],"",hashlib.sha256((q["doi"]+q["title"]).encode()).hexdigest(),json.dumps(q,ensure_ascii=False),x["first_seen"]))
            for f,v in (("venues",q["journal"]),("topics",x["topic"]),("articleTypes",x["article_type"])):
              if v not in data[f]:data[f].append(v)
            data["records"].append({"j":data["venues"].index(q["journal"]),"f":1,"r":0,"t":data["topics"].index(x["topic"]),"c":0,"a":data["articleTypes"].index(x["article_type"]),"e":q["title"],"d":q["doi"],"m":"","p":q["date"],"od":1,"s":x["first_seen"],"z":x["zh_title"],"summary":x["zh_abstract"],"summary_source":"https://doi.org/"+q["doi"]})
          assert len(data["records"])==before+len(new)
          db.commit();db.close();Path("dist/index.html").write_text(page[:a]+json.dumps(data,ensure_ascii=False,separators=(",",":"))+page[b:],encoding="utf-8")
          with open("catalog.sqlite","rb") as s,gzip.open("catalog.sqlite.gz","wb",compresslevel=9) as d:d.write(s.read())
          Path(".publication-log").mkdir(exist_ok=True);Path(".publication-log/2026-11-27-doi.json").write_text(json.dumps({"added_dois":[x["doi"] for x in new],"before":before,"after":len(data["records"])},ensure_ascii=False),encoding="utf-8")
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.sqlite.gz dist/index.html .publication-log
          git diff --cached --quiet || git commit -m "Add approved DOI literature records 2026-11-27"
          git push
      - uses: actions/upload-pages-artifact@v4
        with: {path: dist}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    permissions: {pages: write, id-token: write}
    steps:
      - uses: actions/deploy-pages@v4
