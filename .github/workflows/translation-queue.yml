name: 生成摘要翻译任务

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore archive
        run: |
          python - <<'PY'
          import gzip, shutil
          with gzip.open("catalog.sqlite.gz", "rb") as src, open("catalog.sqlite", "wb") as dst:
              shutil.copyfileobj(src, dst)
          PY
      - name: Export pending abstract translations
        run: python -X utf8 export_abstract_queue.py
      - name: Commit queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 待补中文摘要清单.md
          git diff --cached --quiet || git commit -m "Update abstract translation queue"
          git push

